name: Build Kernel (alioth)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Kernel for alioth (SM8250/SD870)
    runs-on: [self-hosted, ubuntu-22.04]

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Clone ReSukiSU
        run: |
          git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU /tmp/resukisu
          mkdir -p drivers/kernelsu
          cp -r /tmp/resukisu/kernel/* drivers/kernelsu/
          if [ -d /tmp/resukisu/uapi ]; then
            mkdir -p drivers/kernelsu/uapi
            cp -r /tmp/resukisu/uapi/* drivers/kernelsu/uapi/
          fi

      - name: Setup ZyC-Clang 16 Toolchain
        id: toolchain
        run: |
          TOOLCHAIN_DIR="${{ runner.tool_cache }}/zyc-clang"
          CLANG_VERSION="Clang-16.0.6-20260510"
          CLANG_URL="https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/${CLANG_VERSION}.tar.gz"

          if [ -d "${TOOLCHAIN_DIR}/bin" ] && [ -f "${TOOLCHAIN_DIR}/bin/clang" ]; then
            echo "Toolchain cached, skipping download."
          else
            echo "Downloading ${CLANG_VERSION}..."
            wget -q "${CLANG_URL}" -O /tmp/clang.tar.gz
            mkdir -p "${TOOLCHAIN_DIR}"
            tar -xf /tmp/clang.tar.gz -C "${TOOLCHAIN_DIR}" --strip-components=1
            rm -f /tmp/clang.tar.gz
          fi

          echo "TOOLCHAIN_DIR=${TOOLCHAIN_DIR}" >> $GITHUB_OUTPUT
          echo "Clang version:"
          "${TOOLCHAIN_DIR}/bin/clang" --version | head -1

      - name: Apply Local Patches
        run: |
          echo "Applying patches from patches/..."
          for dir in patches/stability patches/ultrasound patches/performance patches/networking; do
            if [ -d "$dir" ]; then
              for patch in "$dir"/*.patch; do
                [ -f "$patch" ] || continue
                echo "Applying: $patch"
                git apply --check "$patch" 2>/dev/null && git apply "$patch" || echo "WARN: patch failed or already applied: $patch"
              done
            fi
          done

      - name: Validate Defconfig
        run: |
          if [ -f scripts/validate_build_config.sh ]; then
            chmod +x scripts/validate_build_config.sh
            bash scripts/validate_build_config.sh arch/arm64/configs/alioth_defconfig
          fi

      - name: Build Kernel
        run: |
          export PATH="${{ steps.toolchain.outputs.TOOLCHAIN_DIR }}/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          make ARCH=arm64 \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CC=clang \
               LLVM=1 \
               LLVM_IAS=1 \
               vendor/alioth_defconfig

          make ARCH=arm64 \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CC=clang \
               LLVM=1 \
               LLVM_IAS=1 \
               -j$(nproc)

      - name: Verify Kernel Image
        run: |
          if [ ! -f arch/arm64/boot/Image.gz-dtb ]; then
            echo "Error: Image.gz-dtb not found!"
            exit 1
          fi
          echo "Kernel image built successfully:"
          ls -lh arch/arm64/boot/Image.gz-dtb

      - name: Verify KSU Symbols
        run: |
          if [ -f scripts/validate_symbols.sh ]; then
            chmod +x scripts/validate_symbols.sh
            bash scripts/validate_symbols.sh arch/arm64/boot/Image.gz-dtb
          else
            echo "No symbol validation script, checking strings..."
            strings arch/arm64/boot/Image.gz-dtb | grep -c ksu || true
          fi

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 /tmp/anykernel3
          rm -rf /tmp/anykernel3/.git

          cd /tmp/anykernel3
          rm -f Image.gz-dtb dtb.img *.zip
          cp "${{ github.workspace }}/arch/arm64/boot/Image.gz-dtb" .

          sed -i 's/do.devicecheck=1/do.devicecheck=0/' anykernel.sh
          sed -i 's/# begin device properties/## AnyKernel setup\n# kernel properties\n  kernel.string=RedAlpha Kernel for alioth (Poco F3)/' anykernel.sh

          ZIP_NAME="RedAlpha-alioth-$(date +%Y%m%d)-${GITHUB_SHA::8}.zip"
          zip -r9 "/tmp/${ZIP_NAME}" . -x "*.git*"

          echo "ZIP_PATH=/tmp/${ZIP_NAME}" >> $GITHUB_ENV
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Run Validation
        run: |
          if [ -f scripts/validate_zip.sh ]; then
            chmod +x scripts/validate_zip.sh
            bash scripts/validate_zip.sh "${{ env.ZIP_PATH }}"
          else
            echo "No validation script found, skipping."
            echo "Verifying ZIP integrity instead..."
            unzip -t "${{ env.ZIP_PATH }}"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error
