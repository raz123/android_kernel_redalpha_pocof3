name: Build Kernel (alioth)

on:
  workflow_dispatch:
  push:
    tags:
      - v*

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: kernel-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build alioth kernel
    runs-on: self-hosted
    container:
      image: ghcr.io/raz123/kernel-builder:latest
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Clone ReSukiSU
        run: |
          git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU /tmp/resukisu
          mkdir -p drivers/kernelsu
          cp -r /tmp/resukisu/kernel/* drivers/kernelsu/
          if [ -d /tmp/resukisu/uapi ]; then
            mkdir -p drivers/kernelsu/uapi
            cp -r /tmp/resukisu/uapi/* drivers/kernelsu/uapi/
          fi

      - name: Verify toolchain
        run: |
          set -euo pipefail
          echo "=== Compiler ==="
          clang --version | sed -n '1,2p'
          echo "=== Linker ==="
          ld.lld --version
          echo "=== Cross-compiler ==="
          aarch64-linux-gnu-gcc --version | sed -n '1p'

      - name: Load build config
        run: |
          set -euo pipefail
          cat config/alioth.env >> "$GITHUB_ENV"

      - name: Validate defconfig
        run: |
          set -euo pipefail
          chmod +x scripts/validate_build_config.sh
          scripts/validate_build_config.sh arch/arm64/configs/alioth_defconfig

      - name: Apply local patches
        run: |
          set -uo pipefail
          if [[ -n "${KERNEL_LOCAL_PATCHES:-}" ]]; then
            IFS=',' read -ra local_patches <<< "$KERNEL_LOCAL_PATCHES"
            for local_patch in "${local_patches[@]}"; do
              echo "Applying: $local_patch"
              if ! git apply --recount "${local_patch}"; then
                echo "WARN: Failed to apply $local_patch, skipping"
              fi
            done
          fi

      - name: Build kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
          KBUILD_BUILD_USER: github-actions
          KBUILD_BUILD_HOST: ubuntu
        run: |
          set -euo pipefail
          make O=out "$DEFCONFIG"
          make O=out olddefconfig
          make -j"$(nproc)" O=out \
            CC=clang \
            LD=ld.lld \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            Image
          test -f out/arch/arm64/boot/Image

      - name: Verify KSU symbols
        run: |
          if [ -f scripts/validate_symbols.sh ]; then
            chmod +x scripts/validate_symbols.sh
            scripts/validate_symbols.sh out/arch/arm64/boot/Image || echo "WARN: KSU symbols missing (ReSukiSU not yet integrated into build system)"
          fi

      - name: Package AnyKernel3 zip
        run: |
          set -euo pipefail
          ak3_dir="AnyKernel3"
          rm -rf "$ak3_dir"
          git clone --filter=blob:none "$AK3_REPO" "$ak3_dir"
          git -C "$ak3_dir" checkout "$AK3_REF"
          rm -rf "$ak3_dir/.git" "$ak3_dir/.github" "$ak3_dir/README.md"
          cp "out/arch/arm64/boot/Image" "$ak3_dir/Image"
          cp "out/.config" "$ak3_dir/.config"
          gzip -c "out/.config" > "$ak3_dir/config.gz"
          sed -i \
            -e 's/^device.name1=.*/device.name1=alioth/' \
            -e 's/^device.name2=.*/device.name2=aliothin/' \
            -e 's/^device.name3=.*/device.name3=/' \
            -e 's/^device.name4=.*/device.name4=/' \
            -e 's/^device.name5=.*/device.name5=/' \
            -e 's|^block=.*|block=/dev/block/bootdevice/by-name/boot|' \
            -e 's|^BLOCK=.*|BLOCK=/dev/block/bootdevice/by-name/boot;|' \
            -e 's/^is_slot_device=.*/is_slot_device=1/' \
            -e 's/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1;/' \
            -e 's/^do.modules=.*/do.modules=0/' \
            "$ak3_dir/anykernel.sh"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            zip_name="${ZIP_BASENAME}-${GITHUB_REF_NAME}.zip"
          else
            zip_name="${ZIP_BASENAME}-r${GITHUB_RUN_NUMBER}.zip"
          fi
          (cd "$ak3_dir" && zip -r9 "../${zip_name}" . -x '*.git*' README.md)
          echo "ZIP_NAME=${zip_name}" >> "$GITHUB_ENV"

      - name: Validate zip
        run: |
          set -euo pipefail
          chmod +x scripts/validate_zip.sh
          scripts/validate_zip.sh "$ZIP_NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          sha256sum "$ZIP_NAME" > "${ZIP_NAME}.sha256"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "RedAlpha Kernel alioth ${{ github.ref_name }}"
          body: |
            ## RedAlpha Kernel - alioth (Poco F3)

            **Tag:** `${{ github.ref_name }}`

            ### Included
            - Kernel image: `Image` (uncompressed)
            - Root solution: ReSukiSU
            - AnyKernel3 flashable ZIP

            ### Installation
            1. Flash ZIP via recovery (TWRP/OrangeFox)
            2. Reboot, verify kernel version
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
