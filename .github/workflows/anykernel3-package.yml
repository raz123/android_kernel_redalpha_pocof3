name: Package AnyKernel3

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: self-hosted
    container:
      image: ghcr.io/raz123/kernel-builder:latest
    steps:
      - uses: actions/checkout@v4

      - name: Download kernel image
        uses: actions/download-artifact@v4
        with:
          name: kernel-image
          path: kernel-out/

      - name: Download kernel modules
        uses: actions/download-artifact@v4
        with:
          name: kernel-modules
          path: kernel-out/modules/
        continue-on-error: true

      - name: Clone AnyKernel3
        run: |
          git clone https://github.com/AstideLabs/AnyKernel3 -b master --single-branch --depth=1 anykernel

      - name: Package
        run: |
          GIT_COMMIT_ID=$(git rev-parse --short=8 HEAD)
          mkdir -p anykernel/kernels/aosp/

          # Copy kernel image
          if [ -f "kernel-out/Image.gz-dtb" ]; then
            cp kernel-out/Image.gz-dtb anykernel/kernels/aosp/
          elif [ -f "kernel-out/Image" ]; then
            cp kernel-out/Image anykernel/kernels/aosp/
          else
            echo "No kernel image found"
            exit 1
          fi

          # Copy modules if present
          if [ -d "kernel-out/modules" ] && [ "$(ls -A kernel-out/modules 2>/dev/null)" ]; then
            mkdir -p anykernel/anykernel-modules/
            cp kernel-out/modules/*.ko anykernel/anykernel-modules/ 2>/dev/null || true
          fi

          cd anykernel
          ZIP_FILENAME="redalpha-pocof3_$(date +'%Y%m%d_%H%M%S')_anykernel3_${GIT_COMMIT_ID}.zip"
          zip -r9 "$ZIP_FILENAME" ./* -x .git .gitignore out/ ./*.zip
          mv "$ZIP_FILENAME" ../

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: anykernel3-zip
          path: "*.zip"
          if-no-files-found: error
