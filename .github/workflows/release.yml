name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Get metadata
        id: vars
        run: |
          echo "BUILD_DATE=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          echo "TAG_NAME=v$(date +'%Y%m%d')-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "SHA_SHORT=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Download ZIP
        uses: actions/download-artifact@v4
        with:
          name: anykernel3-zip
          path: release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG_NAME }}
          name: "RedAlpha PocoF3 Build - ${{ steps.vars.outputs.BUILD_DATE }} (${{ steps.vars.outputs.SHA_SHORT }})"
          body: |
            ## RedAlpha Kernel Build

            - **Date:** ${{ steps.vars.outputs.BUILD_DATE }}
            - **Commit:** `${{ steps.vars.outputs.SHA_SHORT }}`
            - **Device:** Poco F3 (alioth/SM8250)
            - **Kernel:** 4.19.325

            ### What's Changed
            - Fresh rebuild from AstideLabs android16-aptusitu base
            - CI/CD pipeline (Docker-only builds)

            ---
            **Flash via TWRP. Wipe cache/dalvik recommended.**
          files: release-files/*.zip
