name: Build Docker Image

on:
  workflow_dispatch:
permissions:
  packages: write


jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build container image
        run: docker build -t ghcr.io/raz123/kernel-builder:latest .
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push to GHCR
        run: docker push ghcr.io/raz123/kernel-builder:latest
