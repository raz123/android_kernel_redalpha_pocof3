name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      ksu:
        description: 'Enable ReSukiSU (KernelSU)'
        required: true
        type: boolean
        default: true
      release:
        description: 'Create GitHub Release'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t kernel-builder .

      - name: Build kernel
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e KSU=${{ inputs.ksu && '1' || '0' }} \
            kernel-builder \
            bash -c "chmod +x build-kernel.sh && KSU=\$KSU bash build-kernel.sh"

      - name: Fix file permissions
        if: always()
        run: sudo chown -R $(id -u):$(id -g) ${{ github.workspace }} || true

      - name: QA Gates
        run: |
          echo "=== QA Gates ==="
          FAILED=0

          if [ "${{ inputs.ksu }}" == "true" ]; then
            if grep -rq "CONFIG_KSU_SUSFS\|ksu_susfs\|susfs_" drivers/kernelsu/ 2>/dev/null; then
              echo "Gate 0 (SuSFS): PASS"
            else
              echo "Gate 0 (SuSFS): FAIL — no SuSFS symbols found"
              FAILED=1
            fi

            if grep -q "CONFIG_KSU_MANUAL_HOOK=y" out/.config 2>/dev/null; then
              echo "Gate 1 (Hook mode): PASS"
            else
              echo "Gate 1 (Hook mode): FAIL — CONFIG_KSU_MANUAL_HOOK not set"
              FAILED=1
            fi
          else
            echo "Gate 0 (SuSFS): SKIPPED (vanilla build)"
            echo "Gate 1 (Hook mode): SKIPPED (vanilla build)"
          fi

          if grep -q "CONFIG_KALLSYMS=y" out/.config && grep -q "CONFIG_KALLSYMS_ALL=y" out/.config; then
            echo "Gate 2 (KALLSYMS): PASS"
          else
            echo "Gate 2 (KALLSYMS): FAIL"
            FAILED=1
          fi

          if grep -q "CONFIG_SECURITY_SELINUX=y" out/.config; then
            echo "Gate 3 (SELinux): PASS"
          else
            echo "Gate 3 (SELinux): FAIL"
            FAILED=1
          fi

          if grep -q "CONFIG_ANDROID_BINDER" out/.config; then
            echo "Gate 4 (Binder): PASS"
          else
            echo "Gate 4 (Binder): FAIL"
            FAILED=1
          fi

          IMAGE_FILE=""
          if [ -f "out/arch/arm64/boot/Image" ]; then
            IMAGE_FILE="out/arch/arm64/boot/Image"
          elif [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            IMAGE_FILE="out/arch/arm64/boot/Image.gz-dtb"
          fi

          if [ -n "$IMAGE_FILE" ]; then
            SIZE=$(stat -c%s "$IMAGE_FILE" 2>/dev/null || stat -f%z "$IMAGE_FILE" 2>/dev/null)
            if [ "$SIZE" -gt 15728640 ]; then
              echo "Gate 5 (Boot image >15MB): PASS (${SIZE} bytes)"
            else
              echo "Gate 5 (Boot image >15MB): FAIL (${SIZE} bytes < 15728640)"
              FAILED=1
            fi
            if [ "$SIZE" -gt 26214400 ]; then
              echo "Gate 6 (Size budget >25MB): WARNING (${SIZE} bytes)"
            else
              echo "Gate 6 (Size budget): PASS"
            fi
          else
            echo "Gate 5 (Boot image): FAIL — no image found"
            FAILED=1
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo "=== QA GATES FAILED ==="
            exit 1
          fi
          echo "=== QA GATES PASSED ==="

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
          if-no-files-found: error

      - name: Upload modules
        uses: actions/upload-artifact@v4
        with:
          name: kernel-modules
          path: out/modules/
          if-no-files-found: ignore

      - name: Package AnyKernel3 ZIP
        run: |
          GIT_COMMIT_ID=$(git rev-parse --short=8 HEAD)
          KSU_SUFFIX="_ReSukiSU"
          if [ "${{ inputs.ksu }}" != "true" ]; then
            KSU_SUFFIX="_vanilla"
          fi

          git clone https://github.com/AstideLabs/AnyKernel3 -b master --single-branch --depth=1 anykernel
          mkdir -p anykernel/kernels/aosp/

          if [ -f "out/arch/arm64/boot/Image" ]; then
            cp out/arch/arm64/boot/Image anykernel/kernels/aosp/
          elif [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp out/arch/arm64/boot/Image.gz-dtb anykernel/kernels/aosp/
          else
            echo "No kernel image found"
            exit 1
          fi

          if [ -d "out/modules" ] && [ "$(ls -A out/modules 2>/dev/null)" ]; then
            mkdir -p anykernel/anykernel-modules/
            cp out/modules/*.ko anykernel/anykernel-modules/ 2>/dev/null || true
          fi

          cd anykernel
          ZIP_FILENAME="redalpha-pocof3${KSU_SUFFIX}_$(date +'%Y%m%d_%H%M%S')_anykernel3_${GIT_COMMIT_ID}.zip"
          zip -r9 "$ZIP_FILENAME" ./* -x .git .gitignore out/ ./*.zip
          mv "$ZIP_FILENAME" ../

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: anykernel3-zip
          path: "*.zip"
          if-no-files-found: error

      - name: Create GitHub Release
        if: inputs.release == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUILD_DATE=$(date +'%Y%m%d')
          TAG_NAME="v${BUILD_DATE}-$(git rev-parse --short=7 HEAD)"
          KSU_LABEL="ReSukiSU"
          if [ "${{ inputs.ksu }}" != "true" ]; then
            KSU_LABEL="Vanilla"
          fi

          ZIP_FILE=$(ls *.zip 2>/dev/null | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found"
            exit 1
          fi

          gh release create "$TAG_NAME" "$ZIP_FILE" \
            --repo ${{ github.repository }} \
            --title "RedAlpha PocoF3 ${KSU_LABEL} - ${BUILD_DATE}" \
            --notes "## RedAlpha Kernel Build

- **Date:** ${BUILD_DATE}
- **Device:** Poco F3 (alioth/SM8250)
- **Kernel:** 4.19.325
- **Variant:** ${KSU_LABEL}

Flash via TWRP. Wipe cache/dalvik recommended."
