name: PocoF3 Build

on:
  workflow_dispatch:
    inputs:
      ksu:
        description: 'Enable ReSukiSU (KernelSU)'
        required: true
        type: boolean
        default: true
      release:
        description: 'Create GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Sync workspace (persist between builds)
        run: |
          if [ -d "${{ github.workspace }}/build/.git" ]; then
            cd ${{ github.workspace }}/build
            git fetch --depth=1 origin ${{ github.ref_name }}
            git reset --hard FETCH_HEAD
          else
            sudo rm -rf ${{ github.workspace }}/build || true
            git clone --depth=1 https://github.com/${{ github.repository }}.git -b ${{ github.ref_name }} ${{ github.workspace }}/build
          fi

      - name: Build Docker image
        working-directory: build
        run: docker build -t kernel-builder .

      - name: Build kernel
        run: |
          mkdir -p /tmp/ccache-cache
          docker run --rm \
            -v ${{ github.workspace }}/build:/workspace \
            -v /tmp/ccache-cache:/root/.ccache \
            -w /workspace \
            -e KSU=${{ inputs.ksu && '1' || '0' }} \
            -e KBUILD_BUILD_TIMESTAMP='' \
            -e KBUILD_BUILD_VERSION=${{ github.run_number }} \
            kernel-builder \
            bash -c "chmod +x build-kernel.sh && KSU=\$KSU bash build-kernel.sh"

      - name: Fix file permissions
        if: always()
        run: sudo chown -R $(id -u):$(id -g) ${{ github.workspace }}/build || true

      - name: QA Gates
        working-directory: build
        run: |
          echo "=== QA Gates ==="
          FAILED=0
          if [ "${{ inputs.ksu }}" == "true" ]; then
            if grep -q "CONFIG_KSU=y" out/.config 2>/dev/null; then
              echo "Gate 0 (KSU): PASS"
            else
              echo "Gate 0 (KSU): FAIL"; FAILED=1
            fi
            if grep -q "CONFIG_KSU_MANUAL_HOOK=y" out/.config 2>/dev/null; then
              echo "Gate 1 (Hook mode): PASS"
            else
              echo "Gate 1 (Hook mode): WARN"
            fi
          else
            echo "Gate 0-1: SKIPPED (vanilla)"
          fi
          for gate in "KALLSYMS:CONFIG_KALLSYMS=y" "SELinux:CONFIG_SECURITY_SELINUX=y"; do
            NAME="${gate%%:*}"; CFG="${gate##*:}"
            if grep -q "$CFG" out/.config 2>/dev/null; then
              echo "Gate ($NAME): PASS"
            else
              echo "Gate ($NAME): FAIL"; FAILED=1
            fi
          done
          if grep -Eq "CONFIG_ANDROID_BINDER_IPC=[ym]" out/.config 2>/dev/null; then
            echo "Gate (Binder): PASS"
          else
            echo "Gate (Binder): FAIL"; FAILED=1
          fi
          IMAGE=""
          for f in out/arch/arm64/boot/Image out/arch/arm64/boot/Image.gz-dtb; do
            [ -f "$f" ] && IMAGE="$f" && break
          done
          if [ -n "$IMAGE" ]; then
            SIZE=$(stat -c%s "$IMAGE" 2>/dev/null)
            [ "$SIZE" -gt 15728640 ] && echo "Gate (Size): PASS ($SIZE)" || { echo "Gate (Size): FAIL ($SIZE)"; FAILED=1; }
          else
            echo "Gate (Image): FAIL"; FAILED=1
          fi
          if [ -f "out/arch/arm64/boot/dtbo.img" ]; then
            echo "Gate (dtbo.img): PASS"
          elif [ -f "out/arch/arm64/boot/dtb" ]; then
            echo "Gate (dtb): PASS"
          else
            echo "Gate (dtb): WARN (dtbo.img not found)"
          fi
          if [ -f "out/arch/arm64/boot/dtb" ]; then
            echo "Gate (dtb): PASS"
          else
            echo "Gate (dtb): WARN (dtb not found)"
          fi
          [ "$FAILED" -eq 1 ] && { echo "=== QA GATES FAILED ==="; exit 1; }
          echo "=== QA GATES PASSED ==="

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-artifacts
          path: |
            build/out/arch/arm64/boot/Image
            build/out/arch/arm64/boot/Image.gz-dtb
            build/out/arch/arm64/boot/Image.gz
            build/out/modules/
          if-no-files-found: error

      - name: Package AnyKernel3 ZIP
        run: |
          cat > /tmp/package_kernel.sh << 'ENDSCRIPT'
          #!/bin/bash
          set -ex
          git config --global --add safe.directory /workspace
          KSU_SUFFIX="_ReSukiSU"
          [ "${{ inputs.ksu }}" != "true" ] && KSU_SUFFIX="_vanilla"
          rm -rf anykernel anykernel-modules
          git clone https://github.com/AstideLabs/AnyKernel3 -b master --single-branch --depth=1 anykernel
          # === A/B SLOT FIX ===
          # === A/B SLOT FIX: SLOT_SELECT=active auto-detects correct slot ===
          sed -i '1i\SLOT_SELECT=active' anykernel/anykernel.sh
          # === END A/B SLOT FIX ===
          # === Dual-Slot Flash ===
          cat > /tmp/dual_slot_patch1.sh << 'DUALEOF'
          # === Dual-Slot Flash (RedAlpha) ===
          DUAL_SLOT=1;
          OTHER_BLOCK="";
          if [ "$SLOT" ]; then
            ui_print " ";
            ui_print "  -----------------------------------------";
            ui_print "  Dual-Slot Flash Mode";
            ui_print "  -----------------------------------------";
            ui_print "  Default: flash BOTH A/B slots.";
            ui_print "  Abort via ADB: touch /tmp/.skip_dualslot";
            ui_print "  (Or hold VOLUME UP in recovery)";
            ui_print "  -----------------------------------------";
            ui_print " ";
            if [ -f /tmp/.skip_dualslot ]; then
              rm -f /tmp/.skip_dualslot;
              DUAL_SLOT=0;
              ui_print "  -> Skip file found: active slot only.";
            elif timeout 10 getevent -c5 2>/dev/null | grep -qm1 '0001 0073'; then
              DUAL_SLOT=0;
              ui_print "  -> VOLUME UP pressed: active slot only!";
            else
              ui_print "  -> Flashing BOTH slots!";
            fi;
            ui_print "  -----------------------------------------";
            case "$BLOCK" in
              *_a) OTHER_BLOCK="${BLOCK%_a}_b";;
              *_b) OTHER_BLOCK="${BLOCK%_b}_a";;
            esac;
            if [ "$OTHER_BLOCK" = "$BLOCK" ] || [ -z "$OTHER_BLOCK" ]; then
              OTHER_BLOCK="";
              ui_print "  Warning: could not determine other slot block device.";
            else
              ui_print "  Other slot: $OTHER_BLOCK";
            fi;
          fi;
          DUALEOF
          cat > /tmp/dual_slot_patch2.sh << 'DUALEOF'
          # Flash both slots reliably (post-flash_boot)
          if [ "$DUAL_SLOT" = "1" ] && [ -f "${AKHOME}/boot-new.img" ]; then
            IMG="${AKHOME}/boot-new.img";
            ui_print "  -> Flashing active slot ($BLOCK)...";
            if ! dd if="$IMG" of="$BLOCK" bs=4096 2>/dev/null; then
              ui_print "  WARNING: dd to active slot failed!";
            fi;
            if [ "$OTHER_BLOCK" ]; then
              ui_print "  -> Flashing other slot ($OTHER_BLOCK)...";
              if ! dd if="$IMG" of="$OTHER_BLOCK" bs=4096 2>/dev/null; then
                ui_print "  WARNING: dd to other slot failed!";
              fi;
            fi;
            sync;
            ui_print "  -> Both slots flashed successfully!";
          fi;
          DUALEOF
          # Apply dual-slot patches to anykernel.sh
          sed -i '/^# boot install$/r /tmp/dual_slot_patch1.sh' anykernel/anykernel.sh
          sed -i '/^flash_boot;$/r /tmp/dual_slot_patch2.sh' anykernel/anykernel.sh
          # === END Dual-Slot Flash ===
          mkdir -p anykernel/kernels/aosp/
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb anykernel/kernels/aosp/Image
          elif [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image anykernel/kernels/aosp/Image
          fi
          for dtb in out/arch/arm64/boot/dts/qcom/sm8250*.dtb out/arch/arm64/boot/dtb; do
            [ -f "$dtb" ] && cp "$dtb" anykernel/kernels/aosp/dtb && break
          done
          [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img anykernel/kernels/aosp/dtbo.img
          if [ ! -f anykernel/kernels/aosp/dtb ] || [ ! -f anykernel/kernels/aosp/dtbo.img ]; then
            sed -i "s|\[ -f \$AKHOME/kernels/\$os/Image \] && \[ -f \$AKHOME/kernels/\$os/dtb \] && \[ -f \$AKHOME/kernels/\$os/dtbo.img \]|[ -f \$AKHOME/kernels/\$os/Image ]|" anykernel/anykernel.sh
            sed -i "/mv \$AKHOME\/kernels\/\$os\/dtb/d" anykernel/anykernel.sh
            sed -i "/dtbo.img/d" anykernel/anykernel.sh
          fi
          [ -d "out/modules" ] && [ "$(ls -A out/modules 2>/dev/null)" ] && mkdir -p anykernel/anykernel-modules/ && cp out/modules/*.ko anykernel/anykernel-modules/ 2>/dev/null || true
          # Include ZRAM resize script for KSU service.d installation
          [ -f "zram-resize.sh" ] && cp zram-resize.sh anykernel/anykernel-modules/
          [ -f "uclamp_tuning.sh" ] && cp uclamp_tuning.sh anykernel/anykernel-modules/
          # Include Rogers VoLTE fix KernelSU module
          cp -r anykernel-modules/fix_rogers_volte anykernel/anykernel-modules/fix_rogers_volte_module
          chmod 755 anykernel/anykernel-modules/fix_rogers_volte_module/*.sh
          cd anykernel
          ZIP_FILENAME="rp-pocof3${KSU_SUFFIX}_b${BUILD_NUMBER}.zip"
          zip -r9 "$ZIP_FILENAME" ./* -x .git .gitignore out/ ./*.zip
          mv "$ZIP_FILENAME" ../
          ENDSCRIPT
          docker run --rm \
            -v ${{ github.workspace }}/build:/workspace \
            -v /tmp/package_kernel.sh:/tmp/package_kernel.sh:ro \
            -w /workspace \
            -e BUILD_NUMBER=${{ github.run_number }} \
            kernel-builder \
            bash /tmp/package_kernel.sh

      - name: Upload ZIP
        uses: actions/upload-artifact@v6
        with:
          name: anykernel3-zip
          path: build/*.zip
          if-no-files-found: error

      - name: Set release env
        if: inputs.release == true
        working-directory: build
        run: |
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
          BUILD_DATE=$(date +'%Y%m%d')
          TAG_NAME="v${BUILD_DATE}-b${BUILD_NUMBER}"
          KSU_LABEL="ReSukiSU"
          [ "${{ inputs.ksu }}" != "true" ] && KSU_LABEL="Vanilla"
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -1)
          echo "TAG_NAME=${TAG_NAME}" >> "$GITHUB_ENV"
          echo "KSU_LABEL=${KSU_LABEL}" >> "$GITHUB_ENV"
          echo "BUILD_DATE=${BUILD_DATE}" >> "$GITHUB_ENV"
          echo "ZIP_FILE=${ZIP_FILE}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        if: inputs.release == true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "RedAlpha PocoF3 ${{ env.KSU_LABEL }} - ${{ env.BUILD_DATE }}"
          body: |
            ## RedAlpha Kernel Build

            - **Date:** ${{ env.BUILD_DATE }}
            - **Device:** Poco F3 (alioth/SM8250)
            - **Kernel:** 4.19.325
            - **Variant:** ${{ env.KSU_LABEL }}

            Flash via TWRP.
          files: build/${{ env.ZIP_FILE }}
